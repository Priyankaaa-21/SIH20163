name: Security CI & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests-and-audit:
    name: Backend Pytest, PoC Suite & pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        env:
          SECRET_KEY: "ci-test-secret-key-32-chars-long-here"
          ALGORITHM: "HS256"
          ADMIN_PASSWORD: "CiTestStrongPassword2026!"
          FRONTEND_URL: "http://localhost:5173"
          PYTHONPATH: "."
        run: |
          pytest tests/ -v

      - name: Run Before/After PoC Verification Suite
        env:
          SECRET_KEY: "ci-test-secret-key-32-chars-long-here"
          ALGORITHM: "HS256"
          ADMIN_PASSWORD: "CiTestStrongPassword2026!"
          FRONTEND_URL: "http://localhost:5173"
          PYTHONPATH: "."
        run: |
          python -m backend.poc.run_all

      - name: Run Attack Surface Review
        env:
          SECRET_KEY: "ci-test-secret-key-32-chars-long-here"
          ALGORITHM: "HS256"
          ADMIN_PASSWORD: "CiTestStrongPassword2026!"
          PYTHONPATH: "."
        run: |
          python -m backend.targets.worldmonitor_review --path .

      - name: Regenerate Security Reports from Database
        env:
          PYTHONPATH: "."
        run: |
          python -m backend.report_generator

      - name: Upload Security Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-assessment-reports
          path: |
            SECURITY_REPORT.md
            report.html
          retention-days: 30

      - name: Run pip-audit Vulnerability Scan
        run: |
          pip-audit -r backend/requirements.txt --desc || echo "pip-audit completed with findings"

  frontend-audit:
    name: Frontend npm audit & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Build Frontend Application
        working-directory: ./frontend
        run: |
          npm run build

      - name: Run npm audit
        working-directory: ./frontend
        run: |
          npm audit || echo "npm audit detected dependencies requiring updates"
