name: Security CI & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests-and-audit:
    name: Backend Pytest & pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx pip-audit

      - name: Run Pytest Test Suite
        env:
          SECRET_KEY: "ci-test-secret-key-32-chars-long-here"
          ALGORITHM: "HS256"
          ADMIN_PASSWORD: "CiTestStrongPassword2026!"
          FRONTEND_URL: "http://localhost:5173"
        run: |
          pytest tests/ -v

      - name: Run pip-audit Vulnerability Scan
        run: |
          pip-audit --desc || echo "pip-audit completed with findings"

  frontend-audit:
    name: Frontend npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run npm audit
        working-directory: ./frontend
        run: |
          npm audit || echo "npm audit detected dependencies requiring updates"
